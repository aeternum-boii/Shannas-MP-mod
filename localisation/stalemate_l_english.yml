 stalemate_button_start_decision_1_desc: "Use this to start the stalemate counter in a multiplayer war. This will notify the enemy player automatically."
 stalemate_button_end_decision_1_title: "Enforce the stalemate."
 stalemate_button_end_decision_1_desc: "You are §T[Root.st_months_passed_1.GetValue]§! away from being able to enforce the stalemate."
