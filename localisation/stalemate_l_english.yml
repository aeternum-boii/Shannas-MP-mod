 st.1.t: "Start of stalemate counter!"
 st.1.d: "You get this event to notify you that the stalemate counter has been enacted. This means that in 36 months or 3 years the stalemate rule will be enforced. To stop this from happening you have to start sieging forts. If this counter has been started dishonestly please contact a staff member."
 st.1.1: "I hereby acknowledge my knowledge of the stalemate counter starting."
 st.2.t: "Stalemate confirmed!"
 st.2.d: "You are hereby notified that the stalemate counter has run out and that thus the stalemate rules will be enforced, you may pause now. For any disputes over this call a staff member."
 st.2.1: "Only click this away if both parties have acknowledged the stalemate."